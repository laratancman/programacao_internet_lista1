
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Grid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .container {
            display: grid;
            width: 382px;
            height: 288px;
            gap: 5px;

            grid-template-columns: 1fr 1.5fr 1fr;
            grid-template-rows: repeat(4, 1fr);

            grid-template-areas:
                "um um um"
                "dois tres quatro"
                "cinco tres seis"
                "cinco sete sete";
        }

        .item {
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
        }

        .item1 {
            grid-area: um;
            background-color: #ffda80;
        }

        .item2 {
            grid-area: dois;
            background-color: #f23f68;
        }

        .item3 {
            grid-area: tres;
            background-color: #ffda80;
        }

        .item4 {
            grid-area: quatro;
            background-color: #f23f68;
        }

        .item5 {
            grid-area: cinco;
            background-color: #ffda80;
        }

        .item6 {
            grid-area: seis;
            background-color: #f23f68;
        }

        .item7 {
            grid-area: sete;
            background-color: #ffda80;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="item item1">1</div>

        <div class="item item2">2</div>

        <div class="item item3">3</div>

        <div class="item item4">4</div>

        <div class="item item5">5</div>

        <div class="item item6">6</div>

        <div class="item item7">7</div>

    </div>

</body>

</html>
