
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Slide Show</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            width: 90%;
            height: 400px;
            gap: 10px;
        }

        .imagem {
            flex: 1;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: flex 0.6s ease;
        }

        .imagem img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .imagem:hover {
            flex: 5;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="imagem">
            <img src="1.jpg" alt="Imagem 1">
        </div>

        <div class="imagem">
            <img src="2.jpg" alt="Imagem 2">
        </div>

        <div class="imagem">
            <img src="3.jpg" alt="Imagem 3">
        </div>

        <div class="imagem">
            <img src="4.jpg" alt="Imagem 4">
        </div>

        <div class="imagem">
            <img src="5.jpg" alt="Imagem 5">
        </div>

        <div class="imagem">
            <img src="6.jpg" alt="Imagem 6">
        </div>

        <div class="imagem">
            <img src="7.jpg" alt="Imagem 7">
        </div>

        <div class="imagem">
            <img src="8.jpg" alt="Imagem 8">
        </div>

        <div class="imagem">
            <img src="9.jpg" alt="Imagem 9">
        </div>

        <div class="imagem">
            <img src="10.jpg" alt="Imagem 10">
        </div>

    </div>

</body>

</html>
